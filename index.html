<title>Anshu Bhai</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Poppins,sans-serif;background:#090909;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle,#5b4300 0%,#090909 65%);opacity:.5}
.card{position:relative;width:380px;max-width:92%;padding:30px;border-radius:28px;background:rgba(20,20,20,.88);border:1px solid rgba(255,215,0,.2);backdrop-filter:blur(12px);box-shadow:0 0 35px rgba(255,215,0,.18)}
.logo{display:block;width:120px;height:120px;border-radius:50%;margin:auto;border:4px solid #d4af37;box-shadow:0 0 28px rgba(255,215,0,.55);animation:pulse 2s infinite;object-fit:cover}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 45px rgba(255,215,0,.9)}}
h1{text-align:center;margin:18px 0 8px;font-size:38px}
.sub{text-align:center;color:#4cff93;font-weight:700}
p{text-align:center;color:#ddd;margin:16px 0 24px}
.stats{display:flex;gap:10px}
.box{flex:1;background:#121212;padding:14px;border-radius:16px;text-align:center;border:1px solid rgba(255,215,0,.18)}
.box b{display:block;color:#ffd54f;font-size:24px}
.btn{display:block;text-decoration:none;text-align:center;margin-top:24px;padding:16px;border-radius:999px;background:linear-gradient(90deg,#ffe082,#d4a100);color:#111;font-weight:800;box-shadow:0 0 24px rgba(255,215,0,.5);position:relative;overflow:hidden}
.btn:before{content:"";position:absolute;left:-80%;top:0;width:60%;height:100%;background:rgba(255,255,255,.35);transform:skewX(-25deg);animation:shine 2.5s infinite}
@keyframes shine{to{left:160%}}
.float{position:fixed;width:8px;height:8px;background:rgba(255,215,0,.25);border-radius:50%;animation:f 12s linear infinite}
@keyframes f{from{transform:translateY(110vh)}to{transform:translateY(-10vh)}}
</style></head><body>
<script>
for(let i=0;i<25;i++){let d=document.createElement('div');d.className='float';d.style.left=Math.random()*100+'vw';d.style.animationDuration=(8+Math.random()*8)+'s';d.style.animationDelay=(-Math.random()*8)+'s';document.body.appendChild(d);}
</script>
